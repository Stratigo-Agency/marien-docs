# Marien Docs — built and published by .github/workflows/deploy.yml on every push to main.
# To add a page: put a .md file in docs/ and list it under `nav` below. Every page has an
# Indonesian twin next to it with `.id` before `.md` (setting-up-your-device.id.md).

site_name: Marien Docs
site_description: Guides for running screens on Marien.
site_url: https://docs.marien.co.id/

# The pencil on every page opens that page in GitHub's editor — that is how the team edits.
repo_url: https://github.com/Stratigo-Agency/marien-docs
repo_name: marien-docs
edit_uri: edit/main/docs/

theme:
  name: material
  logo: images/marien-wordmark-white.png
  favicon: images/favicon.png
  language: en
  palette:
    scheme: default
    primary: custom       # the Marien blues, set in stylesheets/extra.css
    accent: custom
  features:
    - content.action.edit    # the "edit this page" pencil
    - content.code.copy      # copy button on every command
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow

nav:
  - Home: index.md
  - Set Up Your Device: setting-up-your-device.md
  - Connect a Screen: connecting-a-screen.md
  - Create a Playlist: creating-a-playlist.md
  - Create a Campaign: creating-a-campaign.md
  - Player Releases: player-releases.md
  - Device Owner over Wi-Fi: remote-device-owner-setup.md

markdown_extensions:
  - admonition            # !!! note / !!! warning boxes
  - attr_list             # { .md-button } on a link
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
  # English is the default (docs.marien.co.id/); Indonesian lives under /id/. Pages are
  # paired by file name: page.md is English, page.id.md is its Indonesian twin. Images are
  # shared. The language switcher in the header is added by the plugin.
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: id
          name: Bahasa Indonesia
          build: true
          nav_translations:
            Home: Beranda
            Set Up Your Device: Siapkan Perangkat
            Connect a Screen: Hubungkan Layar
            Create a Playlist: Buat Playlist
            Create a Campaign: Buat Campaign
            Player Releases: Versi Player
            Device Owner over Wi-Fi: Device Owner lewat Wi-Fi

extra_css:
  - stylesheets/extra.css
